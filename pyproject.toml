[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bq-sync"
description = "Sync BigQuery resources to a local directory structure."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.scripts]
bq-sync = "bq_sync.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest",
    "ruff",
]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "bq_sync._bq_sync"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["bq_sync"]
