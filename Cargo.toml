[package]
name = "bq-sync"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Sync BigQuery resources to a local directory structure."
license = "MIT"
readme = "README.md"
repository = "https://github.com/cosmoscalibur/bq_sync"

[lib]
name = "bq_sync"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bq-sync"
path = "src/main.rs"

[features]
default = []
# Builds the `bq_sync._bq_sync` Python extension module (used by maturin).
python = ["dep:pyo3"]

[dependencies]
anyhow = "1"
arrow-array = "60"
arrow-csv = "60"
arrow-schema = "60"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
google-cloud-auth = "1"
google-cloud-bigquery-datatransfer-v1 = "1"
google-cloud-bigquery-v2 = "1"
google-cloud-dataform-v1 = "1"
google-cloud-gax = "1"
google-cloud-wkt = "1"
inbq = "0.18"
log = { version = "0.4", features = ["std"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
regex = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }
toml = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
